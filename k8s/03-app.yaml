apiVersion: v1
kind: Namespace
metadata:
  name: quarkus-mesh-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-mesh-test
  namespace: quarkus-mesh-test
  labels:
    app: quarkus-mesh-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-mesh-test
  template:
    metadata:
      labels:
        app: quarkus-mesh-test
      annotations:
        # OSSM 2.6 uses annotation-based injection (maistra/istio v2 style),
        # not the namespace-label webhook approach used by OSSM 3 / Sail Operator.
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: quarkus-mesh-test
          image: image-registry.openshift-image-registry.svc:5000/quarkus-mesh-test/quarkus-mesh-test:latest
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-mesh-test
  namespace: quarkus-mesh-test
  labels:
    app: quarkus-mesh-test
spec:
  selector:
    app: quarkus-mesh-test
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: quarkus-mesh-test
  namespace: quarkus-mesh-test
spec:
  to:
    kind: Service
    name: quarkus-mesh-test
  port:
    targetPort: http
