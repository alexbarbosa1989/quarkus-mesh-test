# HTTP
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Health checks (used for k8s probes; also handy to confirm the sidecar
# isn't blocking the probe port before mesh-wide mTLS/PeerAuthentication
# is tuned)
quarkus.smallrye-health.root-path=/q/health

# Keep the native/jvm image lean and quiet for a throwaway test app
quarkus.banner.enabled=false
